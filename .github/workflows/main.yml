name: Release Foundry Module

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Update module.json version and download URL
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"
          ZIP_NAME="spindrift-dm-${TAG}.zip"

          jq --arg v "$VERSION" \
             --arg url "https://github.com/FabioC-88/spindrift-dm/releases/download/${TAG}/${ZIP_NAME}" \
             '.version = $v | .download = $url' module.json > module.json.tmp && mv module.json.tmp module.json

      - name: Build Foundry compendium packs
        run: SKIP_BUMP=1 npm run build

      - name: Verify packs were built
        run: |
          if [ ! -d packs ] || [ -z "$(ls -A packs)" ]; then
            echo "::error::La cartella packs/ e' vuota dopo la build, interrompo la release."
            exit 1
          fi

      - name: Commit updated module.json and packs back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add module.json packs
          git commit -m "chore(release): ${GITHUB_REF_NAME}" || echo "No changes to commit"
          git push origin HEAD:main

      - name: Create Zip Archive
        run: |
          ZIP_NAME="spindrift-dm-${GITHUB_REF_NAME}.zip"
          zip -r "$ZIP_NAME" module.json packs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            spindrift-dm-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
